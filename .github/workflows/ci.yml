name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows ${{ matrix.compiler }} ${{ matrix.arch }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang-cl]
        arch: [x86, x64]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v7

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.compiler }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.compiler }}-${{ matrix.arch }}-

      # Hands the variables the developer shell changes on to the later steps.
      - name: Enter the developer environment
        shell: pwsh
        run: |
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=${{ matrix.arch }} -host_arch=amd64"
          Get-ChildItem env: |
              Where-Object { $before[$_.Name] -ne $_.Value } |
              ForEach-Object { "$($_.Name)=$($_.Value)" } |
              Add-Content -Path $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset ${{ matrix.compiler }}-${{ matrix.arch }}

      - name: Build
        run: |
          cmake --build --preset ${{ matrix.compiler }}-${{ matrix.arch }}-debug
          cmake --build --preset ${{ matrix.compiler }}-${{ matrix.arch }}-release

      - name: Test
        run: |
          ctest --preset ${{ matrix.compiler }}-${{ matrix.arch }}-debug
          ctest --preset ${{ matrix.compiler }}-${{ matrix.arch }}-release

      # The Wine job runs these binaries; only one compiler's are needed.
      - name: Upload the test binaries
        if: matrix.compiler == 'msvc'
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.arch }}
          path: |
            out/build/${{ matrix.compiler }}-${{ matrix.arch }}/test/Release/*.exe
            out/build/${{ matrix.compiler }}-${{ matrix.arch }}/test/Release/*.dll
            out/build/${{ matrix.compiler }}-${{ matrix.arch }}/test/hooks/Release/*.exe
            out/build/${{ matrix.compiler }}-${{ matrix.arch }}/test/hooks/Release/*.dll

  wine:
    name: Wine ${{ matrix.arch }}
    needs: windows
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 wine32:i386
          wineboot --init

      - uses: actions/download-artifact@v8
        with:
          name: tests-${{ matrix.arch }}
          path: tests

      # Tests that need a private app hive skip themselves under Wine: native
      # Windows behavior is the spec, and Wine may deviate in edge cases.
      # Each test case runs in a process of its own, as under ctest: hooks
      # stay installed for the life of a process. A comma separates test
      # specs, so one in a name is escaped. Catch2 exits with 4 when the test
      # case skipped itself, which ctest counts as skipped too.
      - name: Test
        working-directory: tests
        run: |
          failures=()
          for test in $(find . -name 'VReg_*Tests.exe'); do
            cd "$(dirname "$test")"
            exe=$(basename "$test")
            mapfile -t names < <(wine "$exe" --list-tests --verbosity quiet | tr -d '\r')
            for name in "${names[@]}"; do
              status=0
              output=$(wine "$exe" "${name//,/\\,}" 2>&1) || status=$?
              if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then
                failures+=("$exe: $name (exit $status)")
                printf '=== %s: %s (exit %s)\n%s\n\n' "$exe" "$name" "$status" "$output"
              fi
            done
            cd - > /dev/null
          done
          if [ ${#failures[@]} -ne 0 ]; then
            printf 'Failed: %s\n' "${failures[@]}"
            exit 1
          fi
