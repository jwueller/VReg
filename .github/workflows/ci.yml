name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows ${{ matrix.compiler }} ${{ matrix.arch }}
    # ARM64 builds and tests natively on an ARM64 runner.
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang-cl]
        arch: [x86, x64, arm64]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      # The whole history, so the version string can count the commits since
      # the last release tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.compiler }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.compiler }}-${{ matrix.arch }}-

      # Hands the variables the developer shell changes on to the later steps.
      - name: Enter the developer environment
        shell: pwsh
        run: |
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=${{ matrix.arch }} -host_arch=${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}"
          Get-ChildItem env: |
              Where-Object { $before[$_.Name] -ne $_.Value } |
              ForEach-Object { "$($_.Name)=$($_.Value)" } |
              Add-Content -Path $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          # MSVC code analysis needs only one compiler and architecture.
          cmake --preset ${{ matrix.compiler }}-${{ matrix.arch }} ${{ matrix.compiler == 'msvc' && matrix.arch == 'x64' && '-DVREG_ANALYZE=ON' || '' }}

      - name: Build
        run: |
          cmake --build --preset ${{ matrix.compiler }}-${{ matrix.arch }}-debug
          cmake --build --preset ${{ matrix.compiler }}-${{ matrix.arch }}-release

      # .clang-tidy lists the checks; one compiler and architecture suffice.
      - name: clang-tidy
        if: matrix.compiler == 'clang-cl' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in git ls-files 'src/*.cpp') {
            clang-tidy -p out/build/clang-cl-x64 --quiet $file
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Test
        run: |
          ctest --preset ${{ matrix.compiler }}-${{ matrix.arch }}-debug
          ctest --preset ${{ matrix.compiler }}-${{ matrix.arch }}-release

      # The Wine job runs these binaries; only one compiler's are needed.
      - name: Upload the test binaries
        if: matrix.compiler == 'msvc' && matrix.arch != 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.arch }}
          path: |
            out/build/${{ matrix.compiler }}-${{ matrix.arch }}/test/Release/*.exe
            out/build/${{ matrix.compiler }}-${{ matrix.arch }}/test/Release/*.dll
            out/build/${{ matrix.compiler }}-${{ matrix.arch }}/test/hooks/Release/*.exe
            out/build/${{ matrix.compiler }}-${{ matrix.arch }}/test/hooks/Release/*.dll

  # vcpkg.json owns the version; these are the copies that must agree with it
  # (CONTRIBUTING.md, "Releasing").
  versions:
    name: Versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: A release tag names the version
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r '."version-semver"' vcpkg.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not name vcpkg.json's version $version."
            exit 1
          fi

      - name: The port names a tagged release
        run: |
          version=$(jq -r '."version-semver"' ports/vreg/vcpkg.json)
          if ! git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "The port names $version, but no tag v$version exists."
            exit 1
          fi

      - name: The version database matches the port
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" x-add-version vreg \
            --x-builtin-ports-root=ports --x-builtin-registry-versions-dir=versions
          if ! git diff --exit-code -- versions; then
            echo "The port changed without its version entry: run the x-add-version above."
            exit 1
          fi

  wine:
    name: Wine ${{ matrix.arch }}
    needs: windows
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 wine32:i386
          wineboot --init

      - uses: actions/download-artifact@v8
        with:
          name: tests-${{ matrix.arch }}
          path: tests

      # Tests that need a private app hive skip themselves under Wine: native
      # Windows behavior is the spec, and Wine may deviate in edge cases.
      # Each test case runs in a process of its own, as under ctest: hooks
      # stay installed for the life of a process. A comma separates test
      # specs, so one in a name is escaped. Catch2 exits with 4 when the test
      # case skipped itself, which ctest counts as skipped too.
      - name: Test
        working-directory: tests
        run: |
          failures=()
          for test in $(find . -name 'VReg_*Tests.exe'); do
            cd "$(dirname "$test")"
            exe=$(basename "$test")
            mapfile -t names < <(wine "$exe" --list-tests --verbosity quiet | tr -d '\r')
            for name in "${names[@]}"; do
              status=0
              output=$(wine "$exe" "${name//,/\\,}" 2>&1) || status=$?
              if [ "$status" -ne 0 ] && [ "$status" -ne 4 ]; then
                failures+=("$exe: $name (exit $status)")
                printf '=== %s: %s (exit %s)\n%s\n\n' "$exe" "$name" "$status" "$output"
              fi
            done
            cd - > /dev/null
          done
          if [ ${#failures[@]} -ne 0 ]; then
            printf 'Failed: %s\n' "${failures[@]}"
            exit 1
          fi

  # Agent's choice: the notes list the commit subjects since the previous
  # release tag. VReg merges no pull requests, so --generate-notes would list
  # nothing, and hand-written notes would be one more step at tagging time.
  # An @word in a subject (Doxygen's @ref) goes in a code span, or GitHub
  # takes it for a mention and lists that user as a contributor.
  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [windows, versions, wine]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^")
          git log --reverse --format='- %s' "$previous..$GITHUB_REF_NAME" |
            sed -E 's/(^|[^`[:alnum:]])@([[:alnum:]-]+)/\1`@\2`/g' > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
